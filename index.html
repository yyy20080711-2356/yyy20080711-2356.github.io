<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资料查阅</title>
<meta name="description" content="受保护的资料查阅页，仅可在线查看，无法下载。">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=()">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="hero">
  <div class="wrap">
    <p class="eyebrow">PROTECTED LIBRARY</p>
    <h1>资料查阅</h1>
    <p class="lead">资料加密存放，仅可在线查阅，无法下载或保存。</p>

    <dl class="stats" id="statsBar" hidden>
      <div class="stat">
        <dt>文件总数</dt>
        <dd id="statCount">—</dd>
      </div>
      <div class="stat">
        <dt>资料总量</dt>
        <dd id="statSize">—</dd>
      </div>
      <div class="stat">
        <dt>最近更新</dt>
        <dd id="statUpdated">—</dd>
      </div>
    </dl>
  </div>
</header>

<main class="wrap">

  <!-- 验证密码 -->
  <section class="panel gate" id="gatePanel" aria-labelledby="gateTitle">
    <div class="gate-inner">
      <div class="gate-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="10.5" width="16" height="10" rx="2"/>
          <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>
          <circle cx="12" cy="15.5" r="1.2"/>
        </svg>
      </div>

      <h2 id="gateTitle">请输入访问密码</h2>
      <p class="gate-desc">文件已加密保存。解锁后仅可在线查阅，页面不提供任何下载。</p>

      <form class="gate-form" id="gateForm" novalidate>
        <label class="sr-only" for="passwordInput">访问密码</label>
        <input
          type="password"
          id="passwordInput"
          name="password"
          class="gate-input"
          placeholder="访问密码"
          autocomplete="current-password"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          maxlength="128"
          required>

        <button type="submit" class="gate-btn" id="gateSubmit">解锁</button>
      </form>

      <p class="gate-msg" id="gateMessage" role="status" aria-live="polite"></p>
    </div>
  </section>

  <!-- 文件列表 -->
  <section class="panel" id="listPanel" aria-labelledby="listTitle" hidden>
    <div class="panel-head">
      <h2 id="listTitle">全部文件</h2>
      <div class="panel-actions">
        <p class="hint">点击「查阅」在线查看，无法保存</p>
        <button type="button" class="btn lock" id="lockBtn">锁定</button>
      </div>
    </div>

    <div class="table-scroll" id="tableScroll">
      <table id="fileTable">
        <thead>
          <tr>
            <th scope="col" class="col-name">
              <button type="button" class="sort" data-sort="name">文件名<span class="arrow"></span></button>
            </th>
            <th scope="col" class="col-cate">分类</th>
            <th scope="col" class="col-size">
              <button type="button" class="sort" data-sort="size">大小<span class="arrow"></span></button>
            </th>
            <th scope="col" class="col-date">
              <button type="button" class="sort" data-sort="updated">更新时间<span class="arrow"></span></button>
            </th>
            <th scope="col" class="col-act">查阅</th>
          </tr>
        </thead>
        <tbody id="fileRows"></tbody>
      </table>
    </div>

    <div id="emptyState" class="empty" hidden>
      <p class="empty-title">暂无文件</p>
      <p class="empty-desc">文件正在整理中，稍后再来看看。</p>
    </div>
  </section>

  <!-- 错误提示 -->
  <section class="panel" id="errorPanel" hidden>
    <div class="empty empty-error">
      <p class="empty-title">加载失败</p>
      <p class="empty-desc" id="errorDetail"></p>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="wrap">
    <p>© <span id="year">2026</span> 杨应尧 · 资料查阅</p>
  </div>
</footer>

<div class="viewer" id="viewer" hidden>
  <div class="viewer-panel" role="dialog" aria-modal="true" aria-labelledby="viewerTitle">
    <div class="viewer-head">
      <div>
        <h3 id="viewerTitle">查阅</h3>
        <p class="viewer-meta" id="viewerMeta"></p>
      </div>
      <button type="button" class="btn lock" id="viewerClose">关闭</button>
    </div>
    <div class="viewer-stage" id="viewerStage"></div>
    <p class="viewer-msg" id="viewerMsg"></p>
    <div class="viewer-nav">
      <button type="button" class="btn lock" id="viewerPrev" hidden>上一张</button>
      <button type="button" class="btn lock" id="viewerNext" hidden>下一张</button>
    </div>
  </div>
</div>

<script src="assets/vault.js"></script>
<script src="assets/preview.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
